quarkus.http.port=8082
quarkus.analytics.disabled=true

# Base de datos H2
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:ordenesdb;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create

# Comunicacion con ms-productos
quarkus.rest-client.productos-api.url=http://localhost:8081
